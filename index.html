<!doctype html>
<html lang="es">
<head>
<title>Mirador</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10161b" media="(prefers-color-scheme: dark)">
<meta name="description" content="Qué pasa, quién lo cuenta y qué falta saber. Noticias comparadas, contexto y debate.">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mirador">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Concepto: sala de lectura cívica. Una columna de lectura con una barra lateral de contexto;
   el papel es frío y quieto, la tinta azul-negra, y el único acento es el azul de lago de Mirador.
   El amarillo de resaltador solo marca lo que se copió literal de un extracto (cifras y citas). */
:root {
  --paper: #f3f5f2;
  --surface: #ffffff;
  --surface-2: #eaeee9;
  --ink: #17212a;
  --ink-2: #47525d;
  --ink-3: #66717c;
  --rule: #d6dcd6;
  --accent: #1d5a72;
  --accent-ink: #ffffff;
  --accent-soft: #e1ecf0;
  --mark: #f4e7a8;
  --chart: #2a78d6;
  --t-analisis: #33569c;
  --t-opinion: #8c5310;
  --t-verif: #2d6a3c;
  --t-vivo: #a3352c;
  --t-otro: #5b4d86;
  --warn: #8c5310;
  --bad: #a3352c;
  --good: #2d6a3c;
  --f-display: "Newsreader", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --f-ui: "Public Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --s-1: 0.25rem; --s-2: 0.5rem; --s-3: 0.75rem; --s-4: 1rem; --s-5: 1.5rem; --s-6: 2rem; --s-7: 3rem;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #10161b; --surface: #172028; --surface-2: #1d2831; --ink: #e5e9ec; --ink-2: #b2bcc5; --ink-3: #8e99a4;
    --rule: #2b3640; --chart: #3987e5; --accent: #86bdd2; --accent-ink: #0d1a20; --accent-soft: #1b3440; --mark: #5c4f1f;
    --t-analisis: #9db5ec; --t-opinion: #e3b06d; --t-verif: #8fcf9f; --t-vivo: #f19c93; --t-otro: #c1b4ee;
    --warn: #e3b06d; --bad: #f19c93; --good: #8fcf9f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #10161b; --surface: #172028; --surface-2: #1d2831; --ink: #e5e9ec; --ink-2: #b2bcc5; --ink-3: #8e99a4;
  --rule: #2b3640; --chart: #3987e5; --accent: #86bdd2; --accent-ink: #0d1a20; --accent-soft: #1b3440; --mark: #5c4f1f;
  --t-analisis: #9db5ec; --t-opinion: #e3b06d; --t-verif: #8fcf9f; --t-vivo: #f19c93; --t-otro: #c1b4ee;
  --warn: #e3b06d; --bad: #f19c93; --good: #8fcf9f; color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--paper); color: var(--ink); font: 15px/1.5 var(--f-ui); margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
a { color: var(--accent); text-underline-offset: 2px; }
a:hover { text-decoration-thickness: 2px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
.wrap { max-width: 1140px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* cabecera */
.mast { padding-block: var(--s-5) var(--s-3); display: flex; flex-wrap: wrap; align-items: end; gap: var(--s-2) var(--s-5); justify-content: space-between; }
.brand { display: flex; align-items: baseline; gap: var(--s-3); flex-wrap: wrap; }
.brand h1 { font: 600 2rem/1 var(--f-display); letter-spacing: -0.01em; margin: 0; }
.brand .tag { font: 400 0.95rem/1.3 var(--f-display); font-style: italic; color: var(--ink-2); }
.edition { font: 400 0.78rem/1.4 var(--f-mono); color: var(--ink-3); text-align: right; }
.edition b { color: var(--ink-2); font-weight: 500; }
@media (max-width: 640px) { .edition { text-align: left; } .brand h1 { font-size: 1.7rem; } }
nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--rule); }
nav.tabs .wrap { display: flex; gap: var(--s-1); overflow-x: auto; scrollbar-width: none; }
nav.tabs a { flex: none; padding: var(--s-3) var(--s-3) calc(var(--s-3) - 2px); color: var(--ink-2); text-decoration: none; font-weight: 500; font-size: 0.92rem; border-bottom: 2px solid transparent; }
nav.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
main { padding-block: var(--s-5) var(--s-7); min-height: 60vh; }

/* tipografía */
h2.view { font: 600 1.85rem/1.15 var(--f-display); margin: 0 0 var(--s-2); text-wrap: balance; letter-spacing: -0.01em; }
.lede { font: 400 1.05rem/1.55 var(--f-display); color: var(--ink-2); margin: 0 0 var(--s-5); max-width: 68ch; }
h3.sec { font: 600 0.74rem/1 var(--f-ui); letter-spacing: 0.09em; text-transform: uppercase; color: var(--ink-3); margin: var(--s-6) 0 var(--s-3); display: flex; gap: var(--s-2); align-items: center; }
h3.sec::after { content: ""; flex: 1; border-top: 1px solid var(--rule); }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }
.small { font-size: 0.85rem; }
.note { font-size: 0.85rem; color: var(--ink-2); background: var(--surface-2); border-radius: var(--r); padding: var(--s-3) var(--s-4); margin: var(--s-3) 0; max-width: 78ch; }
.note b { color: var(--ink); }
.layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--s-6); }
@media (min-width: 980px) { .layout { grid-template-columns: minmax(0, 1fr) 300px; } }
.rail > * + * { margin-top: var(--s-5); }

/* controles */
.chips { display: flex; flex-wrap: wrap; gap: var(--s-2); margin: 0 0 var(--s-4); }
.chip { border: 1px solid var(--rule); background: var(--surface); color: var(--ink-2); border-radius: 999px; padding: 0.3rem 0.75rem; font-size: 0.85rem; cursor: pointer; line-height: 1.3; }
.chip:hover { border-color: var(--ink-3); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.seg { display: inline-flex; flex-wrap: wrap; max-width: 100%; border: 1px solid var(--rule); border-radius: var(--r); overflow: hidden; margin-bottom: var(--s-3); }
.seg button { border: 0; background: var(--surface); padding: 0.4rem 0.9rem; cursor: pointer; font-size: 0.88rem; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--rule); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.btn { border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); border-radius: var(--r); padding: 0.45rem 0.95rem; cursor: pointer; font-weight: 600; font-size: 0.9rem; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.quiet { background: transparent; border-color: var(--rule); color: var(--ink-2); font-weight: 500; }
.btn:disabled { opacity: 0.55; cursor: progress; }
.field { display: grid; gap: var(--s-1); }
.field label { font-size: 0.8rem; font-weight: 600; color: var(--ink-2); }
input[type="text"], input[type="url"], input[type="search"], input[type="date"], input[type="number"], select, textarea {
  background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); padding: 0.5rem 0.65rem; width: 100%; min-width: 0;
}
textarea { min-height: 5.5rem; resize: vertical; font: 400 0.98rem/1.5 var(--f-display); }
.row { display: flex; flex-wrap: wrap; gap: var(--s-3); align-items: end; }
.row > .grow { flex: 1 1 240px; min-width: 0; }
.formgrid { display: grid; gap: var(--s-3); grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); margin-bottom: var(--s-4); }

/* acontecimientos */
.brief { list-style: none; margin: 0; padding: 0; counter-reset: b; }
.brief > li { counter-increment: b; display: grid; grid-template-columns: 2.2rem minmax(0, 1fr); gap: var(--s-3); padding: var(--s-4) 0; border-top: 1px solid var(--rule); }
.brief > li::before { content: counter(b); font: 500 1.5rem/1 var(--f-display); color: var(--ink-3); padding-top: 0.15rem; }
.ev-title { font: 600 1.28rem/1.25 var(--f-display); margin: 0 0 var(--s-1); text-wrap: balance; }
.ev-title a { color: var(--ink); text-decoration: none; }
.ev-title a:hover { text-decoration: underline; text-decoration-color: var(--accent); }
.ev-meta { display: flex; flex-wrap: wrap; gap: var(--s-1) var(--s-3); font: 400 0.78rem/1.4 var(--f-mono); color: var(--ink-3); margin-bottom: var(--s-2); }
.ev-meta .dev { color: var(--t-vivo); }
.ev-outlets { font-size: 0.85rem; color: var(--ink-2); }
.ev-items { list-style: none; margin: var(--s-2) 0 0; padding: 0; display: grid; gap: var(--s-2); }
.ev-items li { font: 400 0.98rem/1.4 var(--f-display); }
.ev-items .src { font: 600 0.75rem/1 var(--f-ui); color: var(--ink-2); margin-right: var(--s-2); text-transform: uppercase; letter-spacing: 0.04em; }
.evlist { list-style: none; margin: 0; padding: 0; }
.evlist > li { padding: var(--s-4) 0; border-top: 1px solid var(--rule); }
.grid-ev { display: grid; gap: var(--s-4); grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); padding: var(--s-4); min-width: 0; }
.card .ev-title { font-size: 1.1rem; }
.empty { padding: var(--s-5); border: 1px dashed var(--rule); border-radius: var(--r); color: var(--ink-2); background: var(--surface); }
.empty b { color: var(--ink); }

/* etiquetas de tipo y acceso */
.ty { display: inline-block; font: 600 0.68rem/1 var(--f-ui); letter-spacing: 0.06em; text-transform: uppercase; padding: 0.22rem 0.42rem; border-radius: 3px; border: 1px solid currentColor; vertical-align: 0.1em; }
.ty-noticia { color: var(--ink-3); }
.ty-análisis { color: var(--t-analisis); }
.ty-opinión { color: var(--t-opinion); }
.ty-verificación { color: var(--t-verif); }
.ty-en-vivo { color: var(--t-vivo); }
.ty-video, .ty-podcast, .ty-investigación { color: var(--t-otro); }
.acc { font: 500 0.72rem/1 var(--f-ui); color: var(--warn); }

/* artículos */
.alist { list-style: none; margin: 0; padding: 0; }
.alist > li { padding: var(--s-4) 0; border-top: 1px solid var(--rule); display: grid; gap: var(--s-1); }
.a-head { display: flex; flex-wrap: wrap; gap: var(--s-1) var(--s-3); align-items: center; font-size: 0.8rem; color: var(--ink-3); }
.a-head .out { font-weight: 700; color: var(--ink-2); }
.a-title { font: 500 1.12rem/1.3 var(--f-display); margin: 0; }
.a-title a { color: var(--ink); }
.a-ex { font: 400 0.97rem/1.5 var(--f-display); color: var(--ink-2); margin: 0; max-width: 72ch; }
.a-ex .lbl { font: 600 0.68rem/1 var(--f-ui); letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-3); margin-right: var(--s-2); }
.a-actions { display: flex; flex-wrap: wrap; gap: var(--s-3); font-size: 0.85rem; }
.linkbtn { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; font-size: 0.85rem; text-decoration: underline; text-underline-offset: 2px; }

/* comparación */
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: var(--r); overflow: hidden; margin: var(--s-4) 0; }
.facts div { background: var(--surface); padding: var(--s-3) var(--s-4); }
.facts b { display: block; font: 500 1.35rem/1.1 var(--f-display); }
.facts span { font-size: 0.78rem; color: var(--ink-3); }
.timeline { list-style: none; margin: 0; padding: 0; position: relative; }
.timeline > li { display: grid; grid-template-columns: 7.2rem minmax(0, 1fr); gap: var(--s-4); padding: var(--s-4) 0; border-top: 1px solid var(--rule); }
@media (max-width: 560px) { .timeline > li { grid-template-columns: minmax(0, 1fr); gap: var(--s-1); } }
.timeline time { font: 400 0.78rem/1.4 var(--f-mono); color: var(--ink-3); }
.terms { display: flex; flex-wrap: wrap; gap: var(--s-2); margin: var(--s-2) 0 var(--s-3); }
.term { font: 400 0.85rem/1.2 var(--f-mono); background: var(--surface-2); padding: 0.25rem 0.5rem; border-radius: 3px; }
.term.shared { background: var(--accent-soft); color: var(--ink); }
.cmp-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
.cmp-table th, .cmp-table td { text-align: left; vertical-align: top; padding: var(--s-3); border-top: 1px solid var(--rule); }
.cmp-table th { font-weight: 700; width: 11rem; color: var(--ink-2); }
.scroll { overflow-x: auto; }
mark { background: var(--mark); color: inherit; padding: 0 0.1em; border-radius: 2px; }
blockquote.q { margin: 0; padding: var(--s-2) var(--s-4); border-left: 3px solid var(--rule); font: italic 400 1rem/1.5 var(--f-display); }
.quote-src { font-size: 0.8rem; color: var(--ink-3); margin-top: var(--s-1); }
.stack > * + * { margin-top: var(--s-3); }

/* mociones */
.motion-text { font: 500 1.45rem/1.35 var(--f-display); margin: var(--s-3) 0; text-wrap: pretty; max-width: 62ch; }
.slide { font: 400 1.02rem/1.6 var(--f-display); max-width: 70ch; }
.slide p { margin: 0 0 var(--s-3); }
.prov { font: 400 0.8rem/1.5 var(--f-mono); color: var(--ink-3); }
.mlist { list-style: none; padding: 0; margin: 0; }
.mlist li { display: grid; grid-template-columns: 6.5rem minmax(0, 1fr); gap: var(--s-3); padding: var(--s-3) 0; border-top: 1px solid var(--rule); }
@media (max-width: 560px) { .mlist li { grid-template-columns: minmax(0, 1fr); gap: var(--s-1); } }
.mlist .rd { font: 400 0.78rem/1.4 var(--f-mono); color: var(--ink-3); }
.mlist a.mt { color: var(--ink); font: 400 1.02rem/1.4 var(--f-display); text-decoration: none; }
.mlist a.mt:hover { text-decoration: underline; }
.bars { display: grid; gap: var(--s-2); max-width: 520px; }
.bar { display: grid; grid-template-columns: 2.6rem minmax(0, 1fr) 3rem; align-items: center; gap: var(--s-2); font-size: 0.85rem; }
.bar .track { height: 14px; position: relative; background: linear-gradient(to right, var(--rule) 1px, transparent 1px) 0 0 / 33.333% 100%; border-left: 1px solid var(--ink-3); }
.bar .fill { position: absolute; inset: 3px auto 3px 0; background: var(--chart); border-radius: 0 4px 4px 0; }
.bar .v { font-family: var(--f-mono); text-align: right; }
.axis { display: grid; grid-template-columns: 2.6rem minmax(0, 1fr) 3rem; gap: var(--s-2); font: 400 0.7rem/1 var(--f-mono); color: var(--ink-3); max-width: 520px; }
.axis div { display: flex; justify-content: space-between; }
.dist { border-collapse: collapse; font-size: 0.85rem; margin-top: var(--s-3); }
.dist th, .dist td { padding: 0.35rem 0.7rem; border-top: 1px solid var(--rule); text-align: right; font-variant-numeric: tabular-nums; }
.dist th:first-child, .dist td:first-child { text-align: left; }
.prep-grid { display: grid; gap: var(--s-4); }
.prep-sec { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); padding: var(--s-4); }
.prep-sec h4 { margin: 0 0 var(--s-2); font: 600 1.02rem/1.3 var(--f-display); }
.prep-sec .hint { font-size: 0.82rem; color: var(--ink-3); margin: 0 0 var(--s-2); }
.cmp { display: grid; gap: var(--s-3); }
.cmp-head, .cmp-row { display: grid; grid-template-columns: minmax(8rem, 0.7fr) 1fr 1fr auto; gap: var(--s-2); align-items: start; }
.cmp-head { font: 600 0.82rem/1.2 var(--f-ui); color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.04em; }
.cmp-head .g, .cmp-row .g textarea { border-top: 3px solid var(--ink); }
.cmp-head .o, .cmp-row .o textarea { border-top: 3px dashed var(--ink-3); }
.cmp-head .g, .cmp-head .o { border-top: none; }
.cmp-row textarea { min-height: 4.5rem; width: 100%; }
.cmp-row input { width: 100%; font-weight: 600; }
.cmp-row .lbl-m { display: none; }
@media (max-width: 640px) {
  .cmp-head { display: none; }
  .cmp-row { grid-template-columns: 1fr; border-top: 1px solid var(--rule); padding-top: var(--s-3); }
  .cmp-row .lbl-m { display: block; font: 600 0.8rem/1.2 var(--f-ui); color: var(--ink-3); margin-bottom: 0.2rem; }
  .cmp-row .rm { justify-self: start; }
}
.pos4 { display: grid; gap: var(--s-3); grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.savestate { font: 400 0.78rem/1 var(--f-mono); color: var(--ink-3); }
.biblio { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
.biblio td, .biblio th { border-top: 1px solid var(--rule); padding: 0.4rem; text-align: left; vertical-align: top; }

/* fuentes */
.src-out { padding: var(--s-4) 0; border-top: 1px solid var(--rule); }
.src-out h4 { margin: 0; font: 600 1.05rem/1.3 var(--f-display); display: flex; flex-wrap: wrap; gap: var(--s-2); align-items: baseline; }
.feed { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--s-2) var(--s-4); padding: var(--s-2) 0 0 var(--s-4); font-size: 0.86rem; }
.feed .st { font: 400 0.76rem/1.4 var(--f-mono); color: var(--ink-3); overflow-wrap: anywhere; }
.dot { display: inline-block; width: 0.55rem; height: 0.55rem; border-radius: 50%; margin-right: 0.35rem; vertical-align: 0.05em; }
.dot.ok { background: var(--good); } .dot.err { background: var(--bad); } .dot.off { background: var(--ink-3); }
.toggle { display: inline-flex; gap: var(--s-2); align-items: center; font-size: 0.85rem; cursor: pointer; }
.dirlist { columns: 2 260px; column-gap: var(--s-6); }
.dirlist section { break-inside: avoid; margin-bottom: var(--s-4); }
.dirlist h4 { margin: 0 0 var(--s-1); font: 600 0.78rem/1.2 var(--f-ui); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); }
.dirlist ul { margin: 0; padding: 0; list-style: none; }
.dirlist li { padding: 0.15rem 0; font-size: 0.9rem; }

/* estados */
.skel { display: grid; gap: var(--s-3); }
.skel i { display: block; height: 1rem; border-radius: 3px; background: linear-gradient(90deg, var(--surface-2), var(--rule), var(--surface-2)); background-size: 200% 100%; animation: sh 1.4s infinite linear; }
@keyframes sh { from { background-position: 200% 0; } to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .skel i { animation: none; } }
.banner { border: 1px solid var(--rule); border-left: 4px solid var(--accent); background: var(--surface); border-radius: var(--r); padding: var(--s-4); margin-bottom: var(--s-4); }
.banner.err { border-left-color: var(--bad); }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--s-4) + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--paper); padding: 0.55rem 1rem; border-radius: var(--r); font-size: 0.9rem; z-index: 20; max-width: calc(100% - 32px); }
.method p, .method li { max-width: 72ch; font: 400 1.02rem/1.6 var(--f-display); }
.method h3 { font: 600 1.2rem/1.3 var(--f-display); margin: var(--s-5) 0 var(--s-2); }
details > summary { cursor: pointer; color: var(--accent); font-size: 0.88rem; }

/* fase 2: semana, hilos, revisiones */

function setNav(name) {

const NUM_RE = /(?:US\$|USD|COP|R\$|\$|€|£)?\s?\d{1,3}(?:[.,\s]\d{3})*(?:[.,]\d+)?\s?(?:%|por ciento|percent|per cent|millones|millón|mil millones|billones|million|billion|bn|personas|people|muertos|dead|heridos|injured|votos|votes|dólares|dollars|pesos|euros|km|kilómetros|toneladas|tonnes|años|years|días|days|soldados|troops|militares|mil\b)?/gi;
const QUOTE_RE = /[“"«]([^”"»]{14,260})[”"»]/g;
function extractFigures(text) {
  const out = [];
  for (const m of text.matchAll(NUM_RE)) {
    const raw = m[0].trim();
    const digits = raw.replace(/[^\d]/g, "");
    if (!digits) continue;
    const v = Number(digits);
    const hasUnit = /[%$€£]|millon|million|billion|personas|people|muert|dead|herid|injur|voto|vote|dólar|dollar|peso|euro|km|tonel|tonne|años|years|días|days|soldad|troop|militar|mil\b|USD|COP/i.test(raw);
    if (!hasUnit && (digits.length < 3 || (v >= 1900 && v <= 2100))) continue;
    const s = Math.max(0, m.index - 70), e = Math.min(text.length, m.index + raw.length + 70);
    out.push({ fig: raw, ctx: (s > 0 ? "…" : "") + text.slice(s, m.index), after: text.slice(m.index + raw.length, e) + (e < text.length ? "…" : "") });
  }
  return out.slice(0, 6);
}
function surfaceMap(arts) {
  const map = new Map();
  for (const a of arts) for (const w of `${a.title} ${a.excerpt || ""}`.split(/[^\p{L}\p{N}]+/u)) { const n = norm(w); if (n && !map.has(n)) map.set(n, w); }
  return map;
}

  ].sort((p, q) => p.day.localeCompare(q.day) || p.t - q.t || String(p.ts || "").localeCompare(String(q.ts || "")));

              <div class="a-head"><span class="kbadge">${esc(r.i.kind)}</span>${r.i.source_name ? `<span class="out">${esc(r.i.source_name)}</span>` : ""}</div>
              <p class="a-title" style="margin-top:.2rem">${r.i.url ? `<a href="${esc(r.i.url)}" target="_blank" rel="noopener">${esc(r.i.title)}</a>` : esc(r.i.title)}</p>

              <p class="a-title" style="margin-top:.2rem"><a href="${esc(outLink(r.a))}" target="_blank" rel="noopener">${esc(r.a.title)}</a></p>
              <div class="a-actions"><button class="linkbtn" data-mkhito="${r.a.id}">Marcar como hito</button>${r.a.event_id ? `<a href="#evento-${r.a.event_id}">Comparar coberturas</a>` : ""}</div>
            </div></li>`).join("")}</ol>`
          : `<div class="empty"><b>La cronología está vacía.</b> ${x.query ? "Ninguna pieza coincide con la búsqueda guardada; prueba con otras palabras." : "Agrega una búsqueda guardada o documenta el primer hito."}</div>`}

              <div class="row"><button class="btn" type="submit">Guardar</button><button class="btn quiet" type="button" id="ef-del">Borrar expediente</button><span class="small" id="ef-st"></span></div>
            </form>
          </details>
        </section>
      </aside>
    </div>`;
  view.querySelectorAll("[data-mode]").forEach((b) => b.onclick = () => { lsSet("dosMode", b.dataset.mode); route(); });
  $("#hf").onsubmit = async (e) => {
    e.preventDefault();
    try {
      await api("dossier_item_save", { dossier_id: id, happened_on: $(`#${i0}f`).value, kind: $(`#${i0}k`).value, title: $(`#${i0}t`).value, url: $(`#${i0}u`).value, source_name: $(`#${i0}s`).value, note: $(`#${i0}n`).value });

      catch (er) { $(`#${j}st`).textContent = er.message; }
    };
  });
};

// ===== Conocimiento: grafo de mociones, conceptos, casos, estudios y fuentes =====
function layoutGraph(nodes, edges, W, H) {
  const n = nodes.length, idx = new Map(nodes.map((x, i) => [x.id, i]));
  const P = nodes.map((x, i) => ({ x: W / 2 + Math.cos((2 * Math.PI * i) / n) * W * 0.36, y: H / 2 + Math.sin((2 * Math.PI * i) / n) * H * 0.36 }));
  const E = edges.map((e) => [idx.get(e.a), idx.get(e.b), e.type === "enlace" ? 1.4 : 0.25 * ((e.shared || []).length || 1)]).filter((e) => e[0] != null && e[1] != null);
  const k = Math.sqrt((W * H) / Math.max(n, 1)) * 0.62;
  const iters = 320;
  for (let it = 0; it < iters; it++) {
    const temp = (W / 9) * (1 - it / iters) + 0.5;
    const F = P.map(() => ({ x: 0, y: 0 }));
    for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
      const dx = P[i].x - P[j].x, dy = P[i].y - P[j].y, d2 = dx * dx + dy * dy + 0.01, f = (k * k) / d2;
      F[i].x += dx * f; F[i].y += dy * f; F[j].x -= dx * f; F[j].y -= dy * f;
    }
    for (const [a, b, w] of E) {
      const dx = P[a].x - P[b].x, dy = P[a].y - P[b].y, d = Math.sqrt(dx * dx + dy * dy) + 0.01, f = (d / k) * w;
      F[a].x -= dx * f; F[a].y -= dy * f; F[b].x += dx * f; F[b].y += dy * f;
    }
    for (let i = 0; i < n; i++) {
      F[i].x += (W / 2 - P[i].x) * 0.6; F[i].y += (H / 2 - P[i].y) * 0.6;
      const m = Math.sqrt(F[i].x ** 2 + F[i].y ** 2) + 0.01, s = Math.min(m, temp) / m;
      P[i].x = Math.max(24, Math.min(W - 150, P[i].x + F[i].x * s));
      P[i].y = Math.max(20, Math.min(H - 20, P[i].y + F[i].y * s));
    }
  }
  return P;
}

  if (ex.down) { const left = ex.total - t; return left <= 0 ? ["end", "Tiempo de preparación cumplido"] : left <= 60 ? ["prot", "Último minuto: ordena tu estructura"] : ["", ""]; }
  if (t >= ex.total + 15) return ["end", "Fuera de tiempo: el juez deja de escuchar"];
  if (t >= ex.total) return ["end", "Tiempo cumplido: 15 segundos de gracia para cerrar"];
  if (ex.poi) { if (t < 60) return ["prot", "Minuto protegido: no se aceptan puntos de información"]; if (t >= ex.total - 60) return ["prot", "Minuto protegido: cierra y resume"]; return ["poi", "Se pueden ofrecer puntos de información"]; }
  return ["", ""];
}
function sparkSvg(pts, lo = 1, hi = 5, ticks = [1, 3, 5]) {
  const W = 240, H = 56, pad = 8;
  if (!pts.length) return `<p class="small muted" style="margin:.4rem 0 0">Sin datos.</p>`;
  const x = (i) => pts.length === 1 ? W / 2 : pad + (i * (W - 2 * pad)) / (pts.length - 1);
  const y = (v) => H - pad - ((Math.min(hi, Math.max(lo, v)) - lo) / (hi - lo)) * (H - 2 * pad);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución de ${lo} a ${hi}">
    ${ticks.map((v) => `<line class="gr" x1="0" x2="${W}" y1="${y(v)}" y2="${y(v)}" vector-effect="non-scaling-stroke"></line>`).join("")}
    ${pts.length > 1 ? `<polyline class="ln" vector-effect="non-scaling-stroke" points="${pts.map((p, i) => `${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(" ")}"></polyline>` : ""}
    ${pts.map((p, i) => `<g tabindex="0" data-tipv="${p.v} de ${hi}" data-tip="${esc(p.tip)}"><circle cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="12" fill="transparent"></circle><circle class="pt" cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="4" vector-effect="non-scaling-stroke"></circle></g>`).join("")}
  </svg>`;
}

      </div>

        await new Promise((ok) => setTimeout(ok, 2500));
        const rr = await api("request_result", { request: r.request });
        if (rr && rr.done) {
          if (rr.body && rr.body.error) { st.textContent = "Error: " + rr.body.error; break; }

};

function statBlock(s) {
  if (!s) return `<p class="small muted">Sin estadísticas publicadas.</p>`;
  if (s.kind === "preliminar") {
    const pos = s.position || {};
    const dist = s.distribution || {};
    return `
      <p class="small" style="margin-top:0">Puntos promedio por posición en <b>${esc(s.debates)}</b> debates (3 = primer lugar, 0 = cuarto).</p>
      <div class="bars" role="img" aria-label="Puntos promedio por posición">
        ${["OG","OO","CG","CO"].map((p) => `<div class="bar" title="${p}: ${pos[p] ?? "–"} puntos en promedio"><b>${p}</b><div class="track"><div class="fill" style="width:${((pos[p] || 0) / 3) * 100}%"></div></div><span class="v">${pos[p] != null ? Number(pos[p]).toFixed(2) : "–"}</span></div>`).join("")}
      </div>
      <div class="axis"><span></span><div><span>0</span><span>1</span><span>2</span><span>3</span></div><span></span></div>
      <p class="small" style="margin:.8rem 0 0">Gobierno ${esc(s.bench?.gov)} · Oposición ${esc(s.bench?.opp)} &nbsp;|&nbsp; Apertura ${esc(s.half?.opening)} · Cierre ${esc(s.half?.closing)}</p>
      <div class="scroll"><table class="dist"><caption class="small muted" style="text-align:left">Cuántas veces quedó cada posición en cada lugar</caption>
        <tr><th>Posición</th><th>1.º</th><th>2.º</th><th>3.º</th><th>4.º</th></tr>
        ${["OG","OO","CG","CO"].map((p) => `<tr><td>${p}</td>${["3","2","1","0"].map((k) => `<td>${dist[p]?.[k] ?? 0}</td>`).join("")}</tr>`).join("")}
      </table></div>`;
  }
  if (s.kind === "eliminatoria") {
    const a = s.advancement || {};
    return `<p class="small" style="margin-top:0">Resultados de ${esc(s.debates)} ${s.debates === 1 ? "debate" : "debates"} de eliminación.</p>
      <div class="scroll"><table class="dist"><tr><th>Posición</th><th>Avanzaron</th><th>De</th></tr>
      ${["OG","OO","CG","CO"].map((p) => `<tr><td>${p}</td><td>${a[p]?.advanced ?? "–"}</td><td>${a[p]?.of ?? "–"}</td></tr>`).join("")}</table></div>`;
  }
  return `<p class="small muted">Sin estadísticas publicadas.</p>`;
}

            <div class="row"><div class="field" style="flex:1"><label for="mcf-k">Tipo</label><select id="mcf-k">${CKINDS.map((k) => `<option>${k}</option>`).join("")}</select></div><button class="btn quiet" type="submit">Enlazar</button></div>
            <span class="small" id="mcf-st"></span>
          </form>
        </section>
      </aside>
    </div>`;
  // guardar preparación
  const collect = () => {
    const sections = {};
    view.querySelectorAll("#prep textarea[data-k]").forEach((t) => { if (t.value.trim()) sections[t.dataset.k] = t.value; });
    const ch = [...view.querySelectorAll("[data-chk]:checked")].map((x) => x.dataset.chk);
    if (ch.length) sections._checklist = JSON.stringify(ch);
    const cmp = [...view.querySelectorAll("#cmp .cmp-row")].map((row) => ({
      a: row.querySelector('[data-cf="a"]').value.trim(), g: row.querySelector('[data-cf="g"]').value, o: row.querySelector('[data-cf="o"]').value,
    }));
    if (cmp.some((r) => r.g.trim() || r.o.trim())) sections._comparativa = JSON.stringify(cmp.filter((r) => r.a || r.g.trim() || r.o.trim()));
    const srcs = [...view.querySelectorAll("#bib tr[data-i]")].map((tr) => ({
      title: tr.querySelector("[data-f=title]").value.trim(), url: tr.querySelector("[data-f=url]").value.trim(),
      date: tr.querySelector("[data-f=date]").value, type: tr.querySelector("[data-f=type]").value,
    })).filter((s) => s.title || s.url);
    return { sections, sources: srcs };
  };
  let saving = false;
  const save = async () => {
    if (saving) return; saving = true;
    const { sections, sources } = collect();
    const missing = sources.filter((s) => !s.url || !s.date).length;
    $("#prep-st").textContent = "Guardando…";
    try { await api("motion_prep", { id, sections, sources }); $("#prep-st").textContent = "Guardado " + fmtTime(new Date()) + (missing ? ` · ${missing} fuente(s) sin enlace o fecha` : ""); }
    catch (e) { $("#prep-st").textContent = e.message; }
    saving = false;
  };
  $("#prep-save").onclick = save;
  view.querySelectorAll("#prep textarea").forEach((t) => { t.addEventListener("change", save); });
  view.querySelectorAll("#cmp .cmp-row").forEach((r) => { r.dataset.bound = "1"; });
  $("#bib-add").onclick = () => { const tb = $("#bib tbody") || $("#bib"); tb.insertAdjacentHTML("beforeend", bibRow({}, Date.now())); };
  $("#bib").addEventListener("change", save);
  $("#bib").addEventListener("click", (e) => { const b = e.target.closest("[data-rm]"); if (b) { b.closest("tr").remove(); save(); } });
  view.querySelectorAll("[data-mc]").forEach((b) => b.onclick = async () => {
    const on = b.getAttribute("aria-pressed") === "true";
    b.setAttribute("aria-pressed", String(!on));
    try { await api("motion_tags", on ? { id, remove: [b.dataset.mc] } : { id, add: [b.dataset.mc] }); } catch (e) { toast(e.message); b.setAttribute("aria-pressed", String(on)); }
  });
  $("#mdiff").onchange = async (e) => { try { await api("motion_tags", { id, difficulty: e.target.value }); toast("Dificultad guardada"); } catch (er) { toast(er.message); } };
  view.querySelectorAll("[data-chk]").forEach((c) => c.addEventListener("change", save));
  $("#cmp").addEventListener("change", (e) => { if (e.target.matches('input[data-cf="a"]') || !e.target.closest(".cmp-row").dataset.bound) save(); });
  $("#cmp").addEventListener("click", (e) => { const b = e.target.closest("[data-cmprm]"); if (b) { b.closest(".cmp-row").remove(); save(); } });
  $("#cmp-add").onclick = () => { $("#cmp").insertAdjacentHTML("beforeend", cmpRow({ a: "", g: "", o: "" }, Date.now())); $("#cmp .cmp-row:last-child input").focus(); };

  // conceptos y conocimiento reutilizable (carga aparte para no demorar la vista)
  const PREPNAME = Object.fromEntries(PREP.map(([k, l]) => [k, l]).concat(POS.map((p) => ["estrategia_" + p.toLowerCase(), "Estrategia " + p])));
  const loadKnowledge = async () => {
    let k;
    try { k = await api("motion_knowledge", { id }, { fresh: true }); } catch (e) { $("#reuse").innerHTML = errorBox(e, loadKnowledge); return; }
    if (!alive()) return;
    $("#mconcepts").innerHTML = (k.concepts || []).length ? `<div class="terms" style="margin-top:0">${k.concepts.map((c) => `<span class="term"><a href="#concepto-${c.id}" style="color:var(--ink);text-decoration:none">${esc(c.name)}</a> <button class="linkbtn" data-cunl="${c.link_id}" aria-label="Quitar ${esc(c.name)}">×</button></span>`).join("")}</div>` : `<p class="small muted" style="margin:0">Ninguno todavía. Los conceptos conectan esta moción con otras y con noticias en el <a href="#conocimiento">mapa de conocimiento</a>.</p>`;
    view.querySelectorAll("[data-cunl]").forEach((b) => b.onclick = async () => { try { await api("concept_unlink", { id: Number(b.dataset.cunl) }); loadKnowledge(); } catch (er) { toast(er.message); } });
    const rel = k.related || [];
    $("#reuse").innerHTML = rel.length ? `<p class="small muted" style="margin-top:0">Mociones conectadas por conceptos que enlazaste, categorías compartidas o texto parecido. Lo que preparaste para ellas puede servir aquí, pero verifica que siga siendo pertinente: otra moción, otra fecha, otro contexto.</p>
      ${rel.map((r) => { const secs = Object.entries(r.prep_sections || {}); const why = [
          (r.shared_concepts || []).length ? "conceptos: " + r.shared_concepts.join(", ") : "",
          (r.shared_categories || []).length ? "categorías: " + r.shared_categories.map((c) => MCATS[c] || c).join(", ") : "",
          r.text_similarity >= 0.25 ? "texto parecido" : ""].filter(Boolean).join(" · ");
        return `<div class="reuse"><a href="#mocion-${r.id}" style="color:var(--ink);font:500 1rem/1.35 var(--f-display);text-decoration:none">${esc(r.text)}</a>
          <div class="prov">${esc(r.tournament)} · ${esc(r.round || "")} · ${esc(why)}</div>
          ${secs.length || (r.sources || []).length ? `<details style="margin-top:var(--s-2)"><summary>${esc(plural(secs.length, "sección preparada", "secciones preparadas"))}${(r.sources || []).length ? ` y ${esc(plural(r.sources.length, "fuente", "fuentes"))}` : ""} · ${esc(fmtAbs(r.prep_updated))}</summary>
            ${secs.map(([sk, sv]) => `<div style="margin-top:var(--s-2)"><b class="small">${esc(PREPNAME[sk] || sk)}</b><pre>${esc(sv)}</pre>${PREPNAME[sk] ? `<button class="linkbtn" data-copy="${esc(sk)}" data-from="${r.id}">Copiar a mi preparación</button>` : ""}</div>`).join("")}
            ${(r.sources || []).length ? `<table class="biblio" style="margin-top:var(--s-2)">${r.sources.map((s, j) => `<tr><td>${esc(s.title)}</td><td>${s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">enlace</a>` : ""}</td><td class="mono">${esc(s.date || "sin fecha")}</td><td><button class="linkbtn" data-cpsrc="${j}" data-from="${r.id}">Agregar a mi bibliografía</button></td></tr>`).join("")}</table>` : ""}
          </details>` : `<p class="small muted" style="margin:.3rem 0 0">Sin preparación guardada todavía.</p>`}</div>`; }).join("")}`
      : `<p class="small muted" style="margin-top:0">Ninguna moción conectada todavía. Enlaza conceptos a esta y a otras mociones para que aparezcan aquí.</p>`;
    view.querySelectorAll("[data-copy]").forEach((b) => b.onclick = () => {
      const r = rel.find((x) => String(x.id) === b.dataset.from); const sk = b.dataset.copy;
      const ta = view.querySelector(`#prep textarea[data-k="${sk}"]`); if (!ta || !r) return;
      ta.value = (ta.value.trim() ? ta.value.trim() + "\n\n" : "") + `[De «${r.text.slice(0, 80)}», preparado ${fmtDate(r.prep_updated)}. Verificar pertinencia.]\n` + r.prep_sections[sk];
      save(); b.textContent = "Copiado"; b.disabled = true;
    });
    view.querySelectorAll("[data-cpsrc]").forEach((b) => b.onclick = () => {
      const r = rel.find((x) => String(x.id) === b.dataset.from); const s = r && r.sources[Number(b.dataset.cpsrc)]; if (!s) return;
      const tb = $("#bib tbody") || $("#bib"); tb.insertAdjacentHTML("beforeend", bibRow(s, Date.now()));
      save(); b.textContent = "Agregada"; b.disabled = true;
    });
  };
  loadKnowledge();
  api("concepts").then((c) => { const dl = $("#mcf-l"); if (dl) dl.innerHTML = (c.concepts || []).map((x) => `<option value="${esc(x.name)}">${esc(x.kind)}</option>`).join(""); }).catch(() => {});
  $("#mcf").onsubmit = async (e) => {
    e.preventDefault();
    const name = $("#mcf-n").value.trim(); if (!name) return;
    try { await api("concept_save", { name, kind: $("#mcf-k").value, link: { motion_id: id } }); $("#mcf-n").value = ""; $("#mcf-st").textContent = ""; loadKnowledge(); }
    catch (er) { $("#mcf-st").textContent = er.message; }
  };
};
function bibRow(s, i) {

    <td><input type="url" data-f="url" aria-label="Enlace" value="${esc(s.url || "")}" placeholder="https://"></td>
    <td><input type="date" data-f="date" aria-label="Fecha" value="${esc(s.date || "")}"></td>

}

  if (!alive()) return;
  const set = d.settings || {};
  SETTINGS = set;
  const prio = set.priority_categories || [];
  const outs = d.outlets || [];
  const feedsN = outs.reduce((n, o) => n + (o.feeds || []).filter((f) => f.active).length, 0);
  const errs = outs.reduce((n, o) => n + (o.feeds || []).filter((f) => f.active && f.last_error).length, 0);
  view.innerHTML = `
    <div class="layout">
      <div>
        <h2 class="view">Fuentes</h2>
        <p class="lede">${feedsN} feeds activos de ${outs.length} medios${errs ? `, ${errs} con error en la última lectura` : ", todos respondieron en la última lectura"}. Cada feed se lee cada 30 minutos; lo que falla 5 veces seguidas pasa a leerse cada 6 horas.</p>

          <h4>${esc(o.name)} <span class="small muted" style="font:400 .8rem var(--f-ui)">${esc(COUNTRY[o.country] || o.country || "")} · ${esc(o.kind)}${ACCESS[o.access] ? " · " + esc(ACCESS[o.access]) : ""} · ${o.articles_7d} piezas en 7 días</span></h4>
          ${o.notes ? `<div class="small muted">${esc(o.notes)}</div>` : ""}
          <label class="toggle small" style="margin-top:.3rem"><input type="checkbox" data-hide="${esc(o.id)}" ${o.hidden ? "checked" : ""}> Ocultar este medio en mis vistas</label>
          ${(o.feeds || []).map((f) => `<div class="feed">
            <div><span class="dot ${!f.active ? "off" : f.last_error ? "err" : "ok"}"></span><b>${esc(f.label)}</b> <span class="muted small">${esc(f.mechanism === "news_sitemap" ? "sitemap de noticias" : "RSS")}</span>
              <div class="st">${f.active ? (f.last_error ? `Error: ${esc(f.last_error)}` : f.last_fetched_at ? `Leído ${esc(ago(f.last_fetched_at))} · ${f.last_items ?? "?"} ítems · ${f.last_new ?? 0} nuevos` : "Pendiente de primera lectura") : esc(f.notes || "Apagado")}</div>
              <div class="st">${esc(f.url)}</div></div>

            <div class="field"><label for="af-out">Medio</label><select id="af-out"><option value="__new">Medio nuevo…</option>${outs.map((o) => `<option value="${esc(o.id)}">${esc(o.name)}</option>`).join("")}</select></div>
            <div id="af-new" class="stack">

              </div>

    } else p.outlet_id = outSel.value;
    st.textContent = "Agregando…";
    try { const r = await api("feed_add", p); st.textContent = r.note; setTimeout(route, 20000); } catch (er) { st.textContent = er.message; }
  };
  $("#refresh").onclick = async () => { const b = $("#refresh"); b.disabled = true; $("#rst").textContent = "Leyendo feeds…"; try { await api("ingest_now"); $("#rst").textContent = "Pedido enviado. Los cambios aparecen en 1 a 2 minutos."; } catch (e) { $("#rst").textContent = e.message; } b.disabled = false; };
};

// ===== Método =====
VIEWS.metodo = async () => {
  view.innerHTML = `<div class="method">
    <h2 class="view">Cómo funciona Mirador</h2>
    <p class="lede">Lo que ves aquí es texto publicado por un medio, un cálculo sobre ese texto o algo que escribiste tú. Mirador no usa inteligencia artificial para resumir, traducir, clasificar ni decidir nada.</p>
    <h3>De dónde vienen las noticias</h3>
    <p>Mirador lee los feeds RSS públicos de cada medio cada 30 minutos (y el sitemap de noticias de El Espectador, que no tiene RSS funcional). Guarda el titular, el extracto que el medio publica en su feed, la fecha, el autor y el enlace. Nunca descarga el artículo completo: para leerlo, abres el original. Los medios con suscripción se marcan como tales.</p>
    <h3>Cómo se agrupan en acontecimientos</h3>
    <p>Cada pieza se reduce a sus términos distintivos: nombres propios, cifras, lugares y palabras poco comunes, con equivalencias entre español, inglés y portugués para palabras frecuentes de la actualidad. Dos piezas se agrupan cuando comparten suficientes términos distintivos en una ventana de 48 horas. Funciona bien con hechos que comparten nombres y cifras; a veces separa un mismo hecho contado con otras palabras, sobre todo entre idiomas.</p>
    <h3>Cómo se ordena la portada</h3>
    <p>Por número de fuentes de origen independientes, variedad de países de los medios que lo cubren e idiomas, con una caída por antigüedad. Varias notas firmadas con la misma agencia cuentan como una sola fuente de origen. No se usan clics, redes sociales ni popularidad.</p>
    <h3>Qué muestra la comparación</h3>
    <ul>
      <li>La cronología de quién publicó qué y cuándo, con el extracto literal de cada medio.</li>
      <li>Los términos que comparten las coberturas y los que solo usa un medio. Es una comparación de vocabulario, no un juicio de sesgo.</li>
      <li>Cifras y citas entre comillas copiadas de los extractos, para que veas si los medios dan los mismos números.</li>
      <li>Qué medios dependen de la misma agencia.</li>
      <li>Un espacio para tus notas y preguntas abiertas: lo que falta confirmar lo decides tú, no la aplicación.</li>
    </ul>
    <h3>Clasificación por reglas</h3>
    <p>Las categorías, los países y los departamentos se detectan con listas de palabras clave. Hay errores: una nota puede quedar en una categoría vecina o sin categoría. El tipo de pieza (noticia, análisis, opinión, verificación, en vivo) sale de la dirección y la sección del medio.</p>
    <h3>Mociones</h3>
    <p>El importador usa la API pública de Tabbycat y la página pública de estadísticas. Guarda el texto y la info slide sin modificarlos, la ronda, la etapa, las estadísticas tal como se publican, la URL de origen y la fecha de consulta. Las categorías temáticas son sugerencias por palabras clave que puedes corregir. Las estadísticas describen resultados del torneo; no son evidencia de que un argumento sea verdadero.</p>
    <h3>La semana y los hilos</h3>
    <p>La vista semanal no está redactada: cuenta piezas por día, categoría y país, y compara con la semana anterior cuando hay datos suficientes. Los hilos unen acontecimientos distintos de los últimos 7 días que comparten al menos dos términos distintivos (nombres, lugares) y ocurrieron con no más de 4 días de diferencia; los términos demasiado comunes (como «gobierno» o «elecciones») no cuentan. Se recalculan cada 30 minutos.</p>
    <h3>Cambios de titular</h3>
    <p>Cada vez que Mirador vuelve a leer un feed y encuentra la misma dirección con otro titular u otro extracto, guarda la versión anterior y la nueva con la hora en que lo detectó. No sabe si fue una corrección, una actualización o un ajuste de estilo; eso se ve en el original. Solo detecta cambios mientras la pieza sigue en el feed.</p>
    <h3>Expedientes</h3>
    <p>Un expediente es una búsqueda guardada más los hitos que tú documentas (anuncio, texto original, debates, modificaciones, votaciones, decisiones judiciales, efectos). Las piezas que encuentra la búsqueda son candidatas; solo las que marcas como hito forman la historia documentada. Un hito sin enlace a su fuente queda señalado.</p>
    <h3>Contexto</h3>
    <p>Cada tema de la biblioteca trae preguntas guía en tres niveles y enlaces a fuentes primarias (normas, datos oficiales, instituciones, guías metodológicas). Las direcciones se comprobaron automáticamente el 28 de octubre de 2026; las que el sitio bloqueó al lector automático están marcadas. No hay textos explicativos escritos por la aplicación: tu explicación va en tus notas.</p>
    <h3>Conocimiento y reutilización</h3>
    <p>Los conceptos, teorías, casos, estudios, actores y fuentes los creas tú y los enlazas a mociones, artículos u otros conceptos. La única conexión automática es entre mociones que comparten dos o más categorías temáticas, y se dibuja punteada. En cada moción, «Conocimiento reutilizable» muestra lo que preparaste para mociones conectadas; al copiarlo, se marca su origen y la fecha para que verifiques si sigue siendo pertinente.</p>
    <h3>Entrenamiento</h3>
    <p>Los cronómetros siguen los tiempos habituales de BP: 15 minutos de preparación y 7 de discurso, con el primer y el último minuto protegidos de puntos de información y 15 segundos de gracia. La evaluación tiene cuatro dimensiones independientes (argumentación, conocimiento, estrategia y desempeño oral) en una escala de 1 a 5. Es una autoevaluación o la de quien te escuche; la aplicación no califica discursos.</p>
    <h3>Límites que conviene tener presentes</h3>
    <ul>
      <li>Washington Post, CNN y Reuters no tienen feed público que funcione; sus despachos aparecen solo cuando otro medio los publica con crédito.</li>
      <li>La Silla Vacía solo expone sus 10 últimas piezas por RSS; El Espectador no trae extracto.</li>
      <li>Un extracto es un fragmento elegido por el medio: no representa todo el artículo.</li>
      <li>Las piezas de más de 90 días se borran, salvo las que guardaste y las de acontecimientos con 3 o más medios.</li>
      <li>El proyecto de Supabase gratuito se pausa si pasa 7 días sin uso. Usar Mirador lo mantiene activo.</li>
    </ul>
  </div>`;
};

// ---------- arranque ----------
async function header() {
  try {
    const s = await api("status", {}, { fresh: true });
    SETTINGS = s.settings || {};
    const now = new Date();
    $("#edition").innerHTML = `<b>${esc(fmtDay(now))}</b><br>Feeds leídos ${esc(ago(s.last_fetch))} · ${s.articles_24h} piezas en 24 h · ${s.feeds_active} feeds`;
  } catch (e) {
    $("#edition").textContent = "";
    throw e;
  }
}
let booted = false;
async function boot() {
  if (!KEY) { view.innerHTML = keyForm(); $("#edition").textContent = ""; return; }
  try { await header(); }
  catch (e) { view.innerHTML = errorBox(e, () => boot()); return; }
  route();
  if (!booted) { booted = true; setInterval(() => { header().catch(() => {}); }, 5 * 60 * 1000); }
}
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("sw.js").catch(() => {});
boot();
</script>
